<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tab Manipulator</title>
    <meta name="manifest.type" content="browser_action" />
  </head>
  <body>
    <div class="popup-shell">
      <header class="popup-header">
        <p class="eyebrow">Tab automation</p>
        <h1>Tab Manipulator</h1>
      </header>

      <main>
        <section
          id="status-region"
          class="status-card"
          aria-labelledby="status-heading"
          aria-describedby="status-description"
          aria-busy="true"
        >
          <div class="status-card__heading">
            <h2 id="status-heading">Status</h2>
            <p id="status-indicator" class="status-indicator" data-tone="neutral">
              <span class="status-indicator__dot" aria-hidden="true"></span>
              <span id="status-label">Loading</span>
            </p>
          </div>

          <p id="status-description" class="status-description">Checking your automation state…</p>

          <dl id="next-action" class="status-details" hidden>
            <div>
              <dt>Next action</dt>
              <dd>
                <span id="next-action-label"></span>
                <span aria-hidden="true"> · </span>
                <time id="next-action-time"></time>
              </dd>
            </div>
          </dl>

          <p id="last-result" class="last-result" data-tone="neutral" hidden></p>
        </section>

        <section id="unsupported-state" class="notice" aria-labelledby="unsupported-heading" hidden>
          <h2 id="unsupported-heading">Limited browser support</h2>
          <p id="unsupported-description"></p>
        </section>

        <section
          id="command-error"
          class="notice notice--error"
          aria-labelledby="error-heading"
          hidden
        >
          <h2 id="error-heading">Status unavailable</h2>
          <p id="error-description"></p>
          <button id="retry-button" type="button">Try again</button>
        </section>

        <section
          id="tab-selection-region"
          class="tab-card"
          aria-labelledby="tab-selection-heading"
          aria-busy="true"
        >
          <div class="tab-card__heading">
            <div>
              <h2 id="tab-selection-heading">Tabs in this window</h2>
              <p>Select the tabs to automate.</p>
            </div>
            <button id="refresh-tabs-button" class="button--quiet button--compact" type="button">
              Refresh tabs
            </button>
          </div>

          <div class="tab-selection-actions" role="group" aria-label="Tab selection controls">
            <button id="select-all-tabs-button" class="button--quiet" type="button" disabled>
              Select all eligible
            </button>
            <button id="clear-tabs-button" class="button--quiet" type="button" disabled>
              Clear
            </button>
          </div>

          <p id="selection-summary" class="selection-summary" aria-live="polite" aria-atomic="true">
            0 tabs selected
          </p>
          <p id="tab-list-loading" class="tab-list-state">Loading tabs&hellip;</p>
          <p id="tab-list-empty" class="tab-list-state" hidden>No tabs are open in this window.</p>
          <div
            id="tab-list-error"
            class="tab-list-state tab-list-state--error"
            role="status"
            hidden
          >
            <p id="tab-list-error-description"></p>
          </div>
          <ul id="tab-list" class="tab-list" aria-label="Tabs in the current window"></ul>
        </section>
      </main>

      <p id="status-announcement" class="visually-hidden" aria-live="polite" aria-atomic="true"></p>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
